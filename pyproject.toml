[project]
name = "banker-hub-mcp"
version = "0.1.0"
description = "MCP server exposing banker_hub transaction history to LLM clients"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.23,<2",
    "httpx>=0.28,<1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.scripts]
banker-hub-mcp = "banker_hub_mcp.server:main"

[dependency-groups]
dev = [
    "mcp[cli]>=1.23,<2",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/banker_hub_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
